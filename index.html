        let subtotal = 0; 
        
        cart.forEach((item, i) => { 
            const itemTotal = (item.price || item.basePrice || 0) * (item.quantity || 1);
            subtotal += itemTotal;
            const img = (item.imageUrls && item.imageUrls[0]) || item.imageUrl || 'https://picsum.photos/60/60?random=5';
            
            const actualBasePrice = item.basePrice || item.originalPrice || item.price;
            const hasAdjustments = item.totalAdjustment !== undefined && item.totalAdjustment !== 0;
            const finalUnitPrice = item.price || actualBasePrice;
            
            // Calculate discount percentage if original price exists
            let discountHtml = '';
            if (item.originalPrice && item.originalPrice > item.price) {
                const discountPercent = Math.round(((item.originalPrice - item.price) / item.originalPrice) * 100);
                discountHtml = `<span class="badge bg-danger ms-2" style="font-size: 0.7rem;">-${discountPercent}%</span>`;
            }
            
            // ---- Stock status (variant-aware) ----
            // getEffectiveMaxStock() looks at the selected variants' stock
            // when there are any, otherwise falls back to the product's
            // own stock - same rule the "+" button uses, so the badge and
            // the button always agree with each other.
            const maxStock = getEffectiveMaxStock(item);
            let stockPillHtml = '';
            if (maxStock !== null) {
                if (maxStock <= 0) {
                    stockPillHtml = `<span class="stock-badge out-stock"><i class="fas fa-times-circle"></i> Out of stock</span>`;
                } else if (maxStock < 5) {
                    stockPillHtml = `<span class="stock-badge low-stock"><i class="fas fa-exclamation-triangle"></i> Only ${maxStock} left</span>`;
                } else {
                    stockPillHtml = `<span class="stock-badge in-stock"><i class="fas fa-check-circle"></i> In stock</span>`;
                }
            } else {
                stockPillHtml = `<span class="stock-badge in-stock"><i class="fas fa-check-circle"></i> In stock</span>`;
            }
            const isOutOfStock = maxStock !== null && maxStock <= 0;
            
            html += `
                <div class="cart-item-card${isOutOfStock ? ' out-of-stock' : ''}" data-index="${i}">
                    <img src="${img}" class="cart-item-img" onerror="this.src='https://placehold.co/60'">
                    <div class="flex-grow-1">
                        <div class="d-flex align-items-start justify-content-between">
                            <h6 class="mb-1 cart-item-name">
                                ${item.name}
                                ${discountHtml}
                            </h6>
                            <i class="fas fa-trash cart-item-remove" data-index="${i}"></i>
                        </div>
                        
                        ${item.selectedVariants && item.selectedVariants.length > 0 ? 
                            `<div class="mb-1">
                                ${item.selectedVariants.map(v => {
                                    const hasVariantAdjustment = v.priceAdjustment && v.priceAdjustment !== 0;
                                    const adjustmentText = hasVariantAdjustment ?
                                        `<span class="${v.priceAdjustment > 0 ? 'text-success' : 'text-danger'} ms-1">
                                            (${v.priceAdjustment > 0 ? '+' : ''}$${v.priceAdjustment.toFixed(2)})
                                        </span>` : '';
                                    
                                    return `<small class="text-muted d-block">• ${v.name}: ${v.value} ${adjustmentText}</small>`
                                }).join('')}
                            </div>` 
                        : ''}
                        
                        <div class="mb-1">${stockPillHtml}</div>
                        
                        <div class="mt-1">
                            ${hasAdjustments ? 
                                `<div class="small">
                                    <span class="text-muted">Base price: $${actualBasePrice.toFixed(2)}</span>
                                    ${item.totalAdjustment > 0 ? 
                                        `<span class="text-success ms-2">+ $${item.totalAdjustment.toFixed(2)} adjustments</span>` : 
                                        `<span class="text-danger ms-2">- $${Math.abs(item.totalAdjustment).toFixed(2)} adjustments</span>`
                                    }
                                </div>` 
                            : ''}
                        </div>
                        
                        <div class="d-flex align-items-center justify-content-between mt-2">
                            <div class="qty-stepper cart-qty-stepper">
                                <button type="button" class="qty-btn cart-qty-minus" data-index="${i}" aria-label="Decrease quantity"><i class="fas fa-minus"></i></button>
                                <span class="qty-value">${item.quantity || 1}</span>
                                <button type="button" class="qty-btn cart-qty-plus" data-index="${i}" aria-label="Increase quantity" ${isOutOfStock ? 'disabled' : ''}><i class="fas fa-plus"></i></button>
                            </div>
                            <div class="text-end">
                                ${item.originalPrice && item.originalPrice > item.price ? 
                                    `<div class="text-muted text-decoration-line-through" style="font-size:0.78rem;">$${item.originalPrice.toFixed(2)}</div>` : ''
                                }
                                <span class="fw-bold text-primary">$${itemTotal.toFixed(2)}</span>
                            </div>
                        </div>
                    </div>
                </div>
            `; 
        });
        
        const deliveryFee = getDeliveryFeeForMethod(selectedDeliveryMethod);
        const total = subtotal + deliveryFee;
        
        const deliveryRowHtml = selectedDeliveryMethod === 'delivery' ? `
            <div class="ios-row cart-summary-row">
                <span class="ios-row-label"><i class="fas fa-truck me-1"></i> Delivery</span>
                <span class="ios-row-value">$${deliveryFee.toFixed(2)}</span>
            </div>` : `
            <div class="ios-row cart-summary-row">
                <span class="ios-row-label"><i class="fas fa-store me-1"></i> Pickup from shop</span>
                <span class="ios-row-value text-success">FREE</span>
            </div>`;
        
        html += `
            <div class="ios-group-card cart-summary-card">
                <div class="ios-row cart-summary-row">
                    <span class="ios-row-label">Subtotal</span>
                    <span class="ios-row-value">$${subtotal.toFixed(2)}</span>
                </div>
                ${deliveryRowHtml}
                <div class="ios-row cart-summary-row cart-summary-total">
                    <span class="ios-row-label">Total</span>
                    <span class="ios-row-value">$${total.toFixed(2)}</span>
                </div>
            </div>
        </div>`;
        
        container.innerHTML = html;
        checkoutTotal.innerText = `$${total.toFixed(2)}`;
        
        window.currentDeliveryFee = deliveryFee;
        
        checkoutSection.style.display = 'block';
        
        container.querySelectorAll('.cart-item-remove').forEach(btn => btn.addEventListener('click', (e) => { 
            e.stopPropagation();
            let idx = e.currentTarget.dataset.index; 
            cart.splice(idx,1); 
            updateCartBadge(); 
            renderCartItems(); 
            showToast('Item removed from cart', 'info', 'Cart Updated');
        }));
        
        // Quantity stepper: "-" removes the line once it hits 1, "+" is
        // capped at the same stock ceiling addToCart() already enforces.
        container.querySelectorAll('.cart-qty-minus').forEach(btn => btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const idx = parseInt(e.currentTarget.dataset.index, 10);
            const item = cart[idx];
            if (!item) return;
            if ((item.quantity || 1) <= 1) {
                cart.splice(idx, 1);
                showToast('Item removed from cart', 'info', 'Cart Updated');
            } else {
                item.quantity -= 1;
            }
            updateCartBadge();
            renderCartItems();
        }));
        
        container.querySelectorAll('.cart-qty-plus').forEach(btn => btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const idx = parseInt(e.currentTarget.dataset.index, 10);
            const item = cart[idx];
            if (!item) return;
            const maxStock = getEffectiveMaxStock(item);
            const currentQty = item.quantity || 1;
            if (maxStock !== null && currentQty >= maxStock) {
                showToast(maxStock <= 0 ? `${item.name} is out of stock` : `Only ${maxStock} in stock`, 'error', 'Stock Limit');
                return;
            }
            item.quantity = currentQty + 1;
            updateCartBadge();
            renderCartItems();
        }));
    }
}
    
    // ----- BACK BUTTON MAPPING -----
    document.getElementById('closeDetailPanel').addEventListener('click', ()=> closePanel(detailPanel));
    backFromCategory.addEventListener('click', ()=> closePanel(categoryPanel));
    document.getElementById('backFromCart').addEventListener('click', ()=> closePanel(cartPanel));

    // Navigation - closing whatever's open first means any nav item can be
    // pressed directly to switch sections, with no need to hit Back first.
    // setActiveNavItem keeps the active-tab underline (Home/Search/Cart/
    // Account) in sync with whichever section is actually on screen.
    function setActiveNavItem(id) {
        document.querySelectorAll('.bottom-nav-item').forEach(item => item.classList.remove('active'));
        document.getElementById(id)?.classList.add('active');
    }

    // Top nav: cart button (right) and search field (left) replace the old
    // bottom tab bar entirely. No account/connect tabs anymore - guest
    // checkout only.
    const topCartBtn = document.getElementById('topCartBtn');
    const topSearchInput = document.getElementById('topSearchInput');
    const topCartCount = document.getElementById('topCartCount');
    if (topCartBtn) {
        topCartBtn.addEventListener('click', (e) => { e.preventDefault(); closeAllPanels(); openCart(); });
    }
    if (topSearchInput) {
        topSearchInput.addEventListener('input', () => {
            searchInput.value = topSearchInput.value;
            debouncedFilterSearch();
        });
        topSearchInput.addEventListener('keyup', (e) => { if (e.key === 'Enter') filterSearch(); });
        // Keep the two search boxes mirrored if the person types in the
        // in-page one instead.
        searchInput.addEventListener('input', () => { if (topSearchInput.value !== searchInput.value) topSearchInput.value = searchInput.value; });
    }

    // Search has no panel/backdrop of its own (it's just the always-visible
    // input up top), so "click outside closes it" means: once the input
    // loses focus, drop the Search tab's active state back to Home - same
    // end result as clicking outside Cart/Settings. The small delay lets a
    // click on the search button itself register first, so it doesn't
    // flicker back to Home before that click's own handler runs.
    searchInput.addEventListener('blur', () => {
        setTimeout(() => {
            if (panelStack.length === 0 && document.activeElement !== searchInput) {
                setActiveNavItem('navHome');
            }
        }, 150);
    });

    async function checkShopExpiry() {
        if (!shopId || shopId === 'demoShop') return false;
        
        try {
            const shopDoc = await getDoc(doc(db, 'shops', shopId));
            if (!shopDoc.exists()) {
                showShopExpiredMessage('Shop not found');
                return true;
            }
            
            const shop = shopDoc.data();
            
            if (!shop.expiryDate) {
                return false;
            }
            
            const expiryDate = shop.expiryDate.seconds 
                ? new Date(shop.expiryDate.seconds * 1000) 
                : new Date(shop.expiryDate);
            
            const now = new Date();
            
            if (now > expiryDate) {
                showShopExpiredMessage('Shop subscription has expired');
                return true;
            }
            
            return false;
        } catch (error) {
            console.error('Error checking shop expiry:', error);
            return false;
        }
    }

    function showShopExpiredMessage(reason = 'Shop has expired') {
        document.getElementById('mainContent').style.display = 'none';
        document.getElementById('categoriesContainer').style.display = 'none';
        document.getElementById('categorySections').style.display = 'none';
        document.getElementById('productsGrid').style.display = 'none';
        
        document.querySelector('.bottom-nav').style.display = 'none';
        
        const banner = document.getElementById('bannerContainer');
        banner.innerHTML = `
            <div style="height: 100vh; background: linear-gradient(135deg, #f5f5f5, #e0e0e0); display: flex; align-items: center; justify-content: center; padding: 20px;">
                <div style="background: white; border-radius: 24px; padding: 40px 30px; width: 100%; max-width: 360px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); text-align: center;">
                    <div style="width: 80px; height: 80px; background: #ffebee; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;">
                        <i class="fas fa-store-slash" style="font-size: 40px; color: #d32f2f;"></i>
                    </div>
                    <h2 style="color: #d32f2f; font-size: 28px; margin-bottom: 12px;">Shop Expired</h2>
                    <p style="color: #757575; font-size: 14px; margin-bottom: 30px;">${reason}. Contact the shop owner to renew.</p>
                    <div style="border-top: 1px solid #e0e0e0; padding-top: 25px;">
                        <h4 style="color: #1d1d1f; font-size: 18px; margin-bottom: 15px;">Contact Owner</h4>
                        <a href="mailto:aliezzshadi035@gmail.com" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #f5f5f5; border-radius: 12px; text-decoration: none; color: #333; margin-bottom: 10px;">
                            <i class="fas fa-envelope" style="color: #1d1d1f; font-size: 18px;"></i>
                            <span style="flex: 1;">aliezzshadi035@gmail.com</span>
                        </a>
                        <a href="https://wa.me/96176647488" target="_blank" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #25D366; border-radius: 12px; text-decoration: none; color: white; margin-bottom: 10px;">
                            <i class="fab fa-whatsapp" style="font-size: 20px;"></i>
                            <span style="flex: 1; font-weight: 500;">Chat on WhatsApp</span>
                            <i class="fas fa-arrow-right"></i>
                        </a>
                    </div>
                </div>
            </div>
        `;
        
        document.getElementById('loadingScreen').classList.add('hidden');
    }

    if (categorySearchInput) {
        categorySearchInput.addEventListener('input', (e) => {
            const catId = categories.find(c => c.name === categoryPanelTitle.innerText)?.id;
            if (catId) loadCategoryProducts(catId, e.target.value);
        });
    }
    const categorySearchClearBtn = document.getElementById('categorySearchClearBtn');
    if (categorySearchClearBtn && categorySearchInput) {
        categorySearchClearBtn.addEventListener('click', () => {
            categorySearchInput.value = '';
            categorySearchInput.dispatchEvent(new Event('input'));
            categorySearchInput.focus();
        });
    }

    // Fetches every active product for this shop once and caches it, so the
    // search bar can match against the whole catalog instead of just the
    // handful of items per category that get preloaded for the homepage rows.
    async function getAllProductsForSearch() {
        if (allProductsCache) return allProductsCache;
        if (!allProductsPromise) {
            allProductsPromise = (async () => {
                try {
                    const q = query(collection(db,'products'), where('shopId','==',shopId), where('active','==',true));
                    const snap = await getDocs(q);
                    const list = [];
                    snap.forEach(d => { const data = d.data(); if (data.price) data.price = parseFloat(data.price); list.push({ id: d.id, ...data }); });
                    allProductsCache = list;
                    return list;
                } catch (e) {
                    console.error(e);
                    allProductsPromise = null; // allow retry on next search
                    return products; // fall back to whatever's already loaded
                }
            })();
        }
        return allProductsPromise;
    }

    function showNoProductsMessage(show, isSearch) {
        if (!noProducts) return;
        noProducts.style.display = show ? 'block' : 'none';
        const heading = noProducts.querySelector('h5');
        if (heading) heading.textContent = isSearch ? 'No matching products' : 'No products';
    }

    async function filterSearch() {
        let term = searchInput.value.trim().toLowerCase();
        if (!term) {
            showNoProductsMessage(false, false);
            if (categories.length > 0) {
                categorySections.style.display = 'block';
                productsGrid.style.display = 'none';
            } else {
                productsGrid.style.display = 'grid';
                categorySections.style.display = 'none';
                renderProducts(products);
            }
            return;
        }

        productsGrid.style.display = 'grid';
        categorySections.style.display = 'none';

        const searchPool = await getAllProductsForSearch();
        // If the person kept typing while we were fetching, this result is
        // stale - the newer keystroke's search (already scheduled) will render.
        if (searchInput.value.trim().toLowerCase() !== term) return;

        const filtered = searchPool.filter(p =>
            p.name?.toLowerCase().includes(term) || p.description?.toLowerCase().includes(term)
        );
        renderProducts(filtered);
        showNoProductsMessage(filtered.length === 0, true);
    }

    let searchDebounceTimer = null;
    function debouncedFilterSearch() {
        clearTimeout(searchDebounceTimer);
        searchDebounceTimer = setTimeout(filterSearch, 250);
    }

    searchBtn.addEventListener('click', filterSearch);
    searchInput.addEventListener('input', debouncedFilterSearch);
    const searchClearBtn = document.getElementById('searchClearBtn');
    if (searchClearBtn) {
        searchClearBtn.addEventListener('click', () => {
            clearTimeout(searchDebounceTimer);
            searchInput.value = '';
            filterSearch();
            searchInput.focus();
        });
    }

    if (addToCartDetailBtn) {
        addToCartDetailBtn.addEventListener('click', ()=>{ 
            if(currentProduct) { 
                window.isAddingFromDetail = true;
                addToCart(currentProduct, detailQty); 
                window.isAddingFromDetail = false;
                closePanel(detailPanel); 
            } 
        });
    }

    // Product-detail quantity stepper
    const detailQtyMinusBtn = document.getElementById('detailQtyMinus');
    const detailQtyPlusBtn = document.getElementById('detailQtyPlus');
    if (detailQtyMinusBtn) {
        detailQtyMinusBtn.addEventListener('click', () => {
            if (detailQty > 1) {
                detailQty--;
                const el = document.getElementById('detailQtyValue');
                if (el) el.textContent = detailQty;
            }
        });
    }
    if (detailQtyPlusBtn) {
        detailQtyPlusBtn.addEventListener('click', () => {
            const maxStock = currentProduct ? getEffectiveMaxStock(currentProduct) : null;
            if (maxStock !== null && detailQty >= maxStock) {
                showToast(`Only ${maxStock} in stock`, 'error', 'Stock Limit');
                return;
            }
            detailQty++;
            const el = document.getElementById('detailQtyValue');
            if (el) el.textContent = detailQty;
        });
    }

    // Load stored user on init
    loadStoredUser();

    (async function init() {
        const isExpired = await checkShopExpiry();
        
        if (!isExpired) {
            await loadShopData();
            updateCartBadge();
            setTimeout(() => { 
                if (categories.length===0 && products.length===0) loadAllProducts(); 
                loadingScreen.classList.add('hidden'); 
            }, 600);
        } else {
            loadingScreen.classList.add('hidden');
        }
    })();
</script>
